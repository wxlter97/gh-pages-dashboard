<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mis Proyectos</title>
    <meta
      name="description"
      content="Panel con los sitios de GitHub Pages publicados, generado automáticamente desde la API de GitHub."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Sistema de marca "wxlter.": papel/tinta/amarillo, Archivo Black +
         Archivo + JetBrains Mono, bordes duros de 2px, radio 0, sin sombras
         ni blur, hover por inversión instantánea de color. Una sola paleta
         clara — el sistema de marca no define modo oscuro. */
      :root {
        --brand-faro: #ffdb00;
        --ink: #111111;
        --paper: #f4f3ef;
        --smoke: #6b6b63;
        --ash: #c9c9c2;
        --ink-soft: #3d3d38;
        --ink-raised: #1c1c1a;
        --on-ink: #edede7;
        --on-ink-dim: #8a8a80;
        --danger: #d92b0c;
        --success: #0b7a45;

        --font-display: 'Archivo Black', 'Archivo', -apple-system, sans-serif;
        --font-body: 'Archivo', -apple-system, sans-serif;
        --font-mono: 'JetBrains Mono', ui-monospace, monospace;

        --rule: 2px solid var(--ink);
        --rule-heavy: 3px solid var(--ink);
        --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      svg {
        vertical-align: -0.125em;
        flex-shrink: 0;
      }

      ::selection {
        background: var(--brand-faro);
        color: var(--ink);
      }

      :focus-visible {
        outline: 3px solid var(--brand-faro);
        outline-offset: 0;
        border-radius: 0;
      }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink-soft);
        font-family: var(--font-body);
        font-size: 16px;
        line-height: 1.45;
      }

      .app-shell {
        max-width: 1080px;
        margin: 0 auto;
        padding: 32px 24px 64px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      .app-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding-bottom: 20px;
        border-bottom: var(--rule);
        flex-wrap: wrap;
      }

      .app-header__titulo {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .app-header__titulo svg {
        flex-shrink: 0;
      }

      .app-header h1 {
        font-family: var(--font-display);
        font-size: 24px;
        letter-spacing: -0.02em;
        color: var(--ink);
        margin: 0;
      }

      .app-header__meta {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--smoke);
        font-family: var(--font-mono);
        font-size: 12px;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }

      .boton-icono {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        border-radius: 0;
        border: var(--rule);
        background: var(--paper);
        color: var(--ink);
        cursor: pointer;
        transition: background-color 120ms var(--ease-out), color 120ms var(--ease-out);
      }

      .boton-icono:hover {
        background: var(--ink);
        color: var(--brand-faro);
      }

      .boton-icono:active {
        background: var(--brand-faro);
        color: var(--ink);
      }

      .boton-icono--girando svg {
        animation: girar 0.8s linear infinite;
      }

      @keyframes girar {
        to {
          transform: rotate(360deg);
        }
      }

      /* ---------- Estados (cargando / vacío / error) ---------- */
      .estado {
        background: var(--paper);
        border: var(--rule);
        padding: 48px 28px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        color: var(--smoke);
      }

      .estado svg {
        color: var(--ink);
        margin-bottom: 6px;
      }

      .estado h2 {
        margin: 0;
        font-family: var(--font-display);
        font-size: 17px;
        letter-spacing: -0.01em;
        color: var(--ink);
      }

      .estado p {
        margin: 0;
        max-width: 46ch;
        font-size: 14.5px;
      }

      .estado code {
        background: var(--ink);
        color: var(--brand-faro);
        padding: 2px 7px;
        font-family: var(--font-mono);
        font-size: 12.5px;
      }

      .estado--error {
        border-color: var(--danger);
      }

      .estado--error svg,
      .estado--error h2 {
        color: var(--danger);
      }

      /* ---------- Grid de tarjetas ---------- */
      .proyectos-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 16px;
      }

      .proyecto-card {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 18px;
        border-radius: 0;
        border: var(--rule);
        background: var(--paper);
        color: inherit;
        text-decoration: none;
        transition: background-color 120ms var(--ease-out), color 120ms var(--ease-out);
      }

      .proyecto-card:hover,
      .proyecto-card:focus-visible {
        background: var(--ink);
        color: var(--on-ink);
      }

      .proyecto-card:hover .proyecto-card__desc,
      .proyecto-card:focus-visible .proyecto-card__desc {
        color: var(--on-ink-dim);
      }

      .proyecto-card:hover .proyecto-card__pie,
      .proyecto-card:focus-visible .proyecto-card__pie,
      .proyecto-card:hover .proyecto-card__externo,
      .proyecto-card:focus-visible .proyecto-card__externo {
        color: var(--brand-faro);
      }

      .proyecto-card:active {
        background: var(--brand-faro);
        color: var(--ink);
      }

      .proyecto-card__cabecera {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
      }

      .proyecto-card__nombre {
        font-weight: 700;
        font-size: 16px;
        letter-spacing: -0.005em;
      }

      .proyecto-card__externo {
        color: var(--smoke);
        flex-shrink: 0;
        margin-top: 2px;
        transition: color 120ms var(--ease-out);
      }

      .proyecto-card__desc {
        font-size: 13.5px;
        color: var(--smoke);
        flex: 1;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
        transition: color 120ms var(--ease-out);
      }

      .proyecto-card__pie {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        font-family: var(--font-mono);
        font-size: 11.5px;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: var(--smoke);
        transition: color 120ms var(--ease-out);
      }

      .proyecto-card__lenguaje {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .proyecto-card__punto {
        width: 8px;
        height: 8px;
        border-radius: 0;
        flex-shrink: 0;
        background: var(--smoke);
      }

      .app-footer {
        text-align: center;
        font-family: var(--font-mono);
        font-size: 11.5px;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: var(--smoke);
        padding-top: 12px;
        border-top: var(--rule);
      }

      .app-footer a {
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div class="app-header__titulo">
          <svg width="26" height="26" viewBox="0 0 100 100" aria-hidden="true">
            <rect width="100" height="100" fill="#111111" />
            <polyline
              points="14,24 32,76 50,44 68,76 86,24"
              fill="none"
              stroke="#FFDB00"
              stroke-width="15"
              stroke-linejoin="miter"
            />
          </svg>
          <h1>Mis Proyectos</h1>
        </div>
        <div class="app-header__meta">
          <span id="meta-texto">Cargando…</span>
          <button id="boton-refrescar" class="boton-icono" title="Actualizar" aria-label="Actualizar">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"></polyline>
              <polyline points="1 20 1 14 7 14"></polyline>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
          </button>
        </div>
      </header>

      <main id="contenido">
        <div class="estado">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M12 6v6l4 2"></path>
          </svg>
          <p>Buscando proyectos publicados…</p>
        </div>
      </main>

      <footer class="app-footer">
        Datos obtenidos en vivo de la API pública de GitHub · repos con el topic
        <code>showcase</code> y GitHub Pages activado
      </footer>
    </div>

    <script>
      const USUARIO = 'wxlter97';
      const TOPIC_REQUERIDO = 'showcase';
      // Los dominios personalizados de GitHub Pages se configuran por
      // repositorio (Settings → Pages → Custom domain), no existe un
      // "dominio de cuenta" que reemplace *.github.io para todos los sitios.
      // Verificado vía GET /repos/{owner}/{repo}/pages para cada repo con el
      // topic showcase: ninguno define cname, así que su URL real es la que
      // asigna GitHub por defecto. Si un repo sí define su propio "homepage"
      // en GitHub, ese valor tiene prioridad (ver más abajo).
      const CACHE_KEY = 'gh-pages-dashboard:cache';
      const CACHE_TTL_MS = 5 * 60 * 1000; // 5 minutos

      const elContenido = document.getElementById('contenido');
      const elMeta = document.getElementById('meta-texto');
      const elBotonRefrescar = document.getElementById('boton-refrescar');

      const ICONO_EXTERNO = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>`;

      const COLORES_LENGUAJE = {
        JavaScript: '#f1e05a',
        TypeScript: '#3178c6',
        Python: '#3572A5',
        HTML: '#e34c26',
        CSS: '#563d7c',
        Swift: '#F05138',
        Java: '#b07219',
        Go: '#00ADD8',
        Rust: '#dea584',
        Shell: '#89e051',
      };

      function formatearFechaRelativa(fechaISO) {
        const diffMs = Date.now() - new Date(fechaISO).getTime();
        const dias = Math.floor(diffMs / (1000 * 60 * 60 * 24));
        if (dias <= 0) return 'hoy';
        if (dias === 1) return 'ayer';
        if (dias < 30) return `hace ${dias} días`;
        const meses = Math.floor(dias / 30);
        if (meses < 12) return `hace ${meses} ${meses === 1 ? 'mes' : 'meses'}`;
        const anios = Math.floor(meses / 12);
        return `hace ${anios} ${anios === 1 ? 'año' : 'años'}`;
      }

      function renderEstado({ icono, titulo, descripcionHTML, error = false }) {
        elContenido.innerHTML = `
          <div class="estado ${error ? 'estado--error' : ''}">
            ${icono}
            <h2>${titulo}</h2>
            <p>${descripcionHTML}</p>
          </div>
        `;
      }

      function renderProyectos(repos) {
        if (repos.length === 0) {
          renderEstado({
            icono: `<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"></rect><path d="M8 12h8M12 8v8"></path></svg>`,
            titulo: 'Todavía no hay proyectos publicados aquí',
            descripcionHTML: `Agrega el topic <code>${TOPIC_REQUERIDO}</code> a cualquier repositorio con GitHub Pages activado (Settings → General → Topics, o desde la app de GitHub) y aparecerá aquí automáticamente.`,
          });
          return;
        }

        const tarjetas = repos
          .map((repo) => {
            const url = repo.homepage && repo.homepage.trim() ? repo.homepage : `https://${USUARIO}.github.io/${repo.name}/`;
            const color = COLORES_LENGUAJE[repo.language] || 'var(--smoke)';
            const desc = repo.description ? escaparHTML(repo.description) : 'Sin descripción.';
            return `
              <a class="proyecto-card" href="${url}" target="_blank" rel="noopener noreferrer">
                <div class="proyecto-card__cabecera">
                  <span class="proyecto-card__nombre">${escaparHTML(repo.name)}</span>
                  <span class="proyecto-card__externo">${ICONO_EXTERNO}</span>
                </div>
                <p class="proyecto-card__desc">${desc}</p>
                <div class="proyecto-card__pie">
                  ${
                    repo.language
                      ? `<span class="proyecto-card__lenguaje"><span class="proyecto-card__punto" style="background:${color}"></span>${escaparHTML(repo.language)}</span>`
                      : '<span></span>'
                  }
                  <span>${formatearFechaRelativa(repo.pushed_at)}</span>
                </div>
              </a>
            `;
          })
          .join('');

        elContenido.innerHTML = `<div class="proyectos-grid">${tarjetas}</div>`;
      }

      function escaparHTML(texto) {
        const div = document.createElement('div');
        div.textContent = texto;
        return div.innerHTML;
      }

      async function obtenerTodosLosRepos() {
        const repos = [];
        let pagina = 1;
        while (true) {
          const resp = await fetch(
            `https://api.github.com/users/${USUARIO}/repos?per_page=100&page=${pagina}&sort=pushed`,
            { headers: { Accept: 'application/vnd.github+json' } }
          );
          if (!resp.ok) {
            const err = new Error(`GitHub API respondió ${resp.status}`);
            err.status = resp.status;
            throw err;
          }
          const lote = await resp.json();
          repos.push(...lote);
          if (lote.length < 100) break;
          pagina += 1;
        }
        return repos;
      }

      function leerCache() {
        try {
          const crudo = localStorage.getItem(CACHE_KEY);
          if (!crudo) return null;
          const { timestamp, repos } = JSON.parse(crudo);
          if (Date.now() - timestamp > CACHE_TTL_MS) return null;
          return { timestamp, repos };
        } catch {
          return null;
        }
      }

      function guardarCache(repos) {
        try {
          localStorage.setItem(CACHE_KEY, JSON.stringify({ timestamp: Date.now(), repos }));
        } catch {
          /* localStorage no disponible: se ignora silenciosamente */
        }
      }

      async function cargar({ forzar = false } = {}) {
        elBotonRefrescar.classList.add('boton-icono--girando');
        elBotonRefrescar.disabled = true;

        const cache = !forzar ? leerCache() : null;
        if (cache) {
          const filtrados = cache.repos.filter((r) => r.has_pages && (r.topics || []).includes(TOPIC_REQUERIDO));
          renderProyectos(filtrados);
          elMeta.textContent = `Actualizado ${formatearFechaRelativa(new Date(cache.timestamp).toISOString())}`;
          elBotonRefrescar.classList.remove('boton-icono--girando');
          elBotonRefrescar.disabled = false;
          return;
        }

        try {
          const repos = await obtenerTodosLosRepos();
          guardarCache(repos);
          const filtrados = repos.filter((r) => r.has_pages && (r.topics || []).includes(TOPIC_REQUERIDO));
          renderProyectos(filtrados);
          elMeta.textContent = 'Actualizado ahora';
        } catch (e) {
          const esLimite = e.status === 403;
          renderEstado({
            icono: `<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>`,
            titulo: esLimite ? 'Límite de la API de GitHub alcanzado' : 'No se pudo cargar la lista',
            descripcionHTML: esLimite
              ? 'GitHub limita las consultas sin autenticar a 60 por hora. Intenta de nuevo en unos minutos.'
              : 'Ocurrió un error al consultar la API de GitHub. Intenta de nuevo.',
            error: true,
          });
          elMeta.textContent = 'Error al actualizar';
        } finally {
          elBotonRefrescar.classList.remove('boton-icono--girando');
          elBotonRefrescar.disabled = false;
        }
      }

      elBotonRefrescar.addEventListener('click', () => cargar({ forzar: true }));
      cargar();
    </script>
  </body>
</html>
